name: release

# Either push a tag like v1.1.0, or run this workflow from the Actions tab
# ("Run workflow", enter the version). The exe is built here from the source,
# never uploaded by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.1.0). Built from the selected branch."
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "버전 형식: v1.2.3" }
          $want = $env:TAG.Substring(1)
          $have = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($want -ne $have) { throw "태그 $env:TAG 와 Cargo.toml 버전 $have 불일치" }
      - run: cargo test -p sng-core
      - run: cargo build --release -p safari-nikke-guard
      - name: Name and hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/safari-nikke-guard.exe out/SafariNikkeGuard.exe
          $h = (Get-FileHash out/SafariNikkeGuard.exe -Algorithm SHA256).Hash.ToLower()
          "$h  SafariNikkeGuard.exe" | Out-File -Encoding ascii out/SHA256SUMS.txt
          "HASH=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          NIKKE PC 런처 악성코드 점검기 $env:TAG

          SafariNikkeGuard.exe 다운로드 후 실행. 설치 불필요 (Windows 10/11).
          SmartScreen 경고: 추가 정보 → 실행

          SHA-256: ``$env:HASH``

          이 파일은 GitHub Actions가 커밋 $env:GITHUB_SHA 소스로 빌드함.
          "@
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG out/SafariNikkeGuard.exe out/SHA256SUMS.txt --clobber
            gh release edit $env:TAG --notes $notes
          } else {
            gh release create $env:TAG out/SafariNikkeGuard.exe out/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Safari NIKKE Guard $env:TAG" --notes $notes --latest
          }
