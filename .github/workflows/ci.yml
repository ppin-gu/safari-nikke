name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sng-core
      - run: cargo clippy -p sng-core --all-targets -- -D warnings

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sng-core
      - run: cargo clippy -p sng-core --all-targets -- -D warnings
      - run: cargo build --release -p safari-nikke-guard
      - uses: actions/upload-artifact@v4
        with:
          name: SafariNikkeGuard-${{ github.sha }}
          path: target/release/safari-nikke-guard.exe
